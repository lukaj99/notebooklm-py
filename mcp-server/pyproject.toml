[project]
name = "notebooklm-mcp"
version = "0.1.0"
description = "Model Context Protocol server for Google NotebookLM"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    # [mcp] pulls fastmcp (pinned ==3.4.4 in the root pyproject, where the
    # rationale lives). Required two ways: the root package's `notebooklm-mcp`
    # stdio entry point imports fastmcp at module scope, and server.py patches
    # fastmcp's in-memory token expiry to 365 days. That patch is wrapped in
    # try/except ImportError, so without fastmcp it silently no-ops and remote
    # OAuth tokens revert to a 1-hour expiry ("Connection expired" on reconnect).
    "notebooklm-py[mcp]>=0.3.0",
    "mcp>=1.28.1",
    "starlette>=0.37.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.4.0",
]
https = ["uvicorn[standard]>=0.30.0"]

[project.scripts]
# NOT `notebooklm-mcp`: the root notebooklm-py package already ships a console
# script by that name (notebooklm.mcp.__main__:main, its upstream-documented
# entry point). Both packages install into the same venv, so a shared name is
# won by whichever is installed last — which silently swapped this CLI for the
# root's and broke callers passing the positional `stdio` arg this one takes.
notebooklm-mcp-local = "notebooklm_mcp.server:main"
notebooklm-mcp-remote = "notebooklm_mcp.remote:main"
notebooklm-mcp-sse = "notebooklm_mcp.sse_server:main"

[tool.uv.sources]
notebooklm-py = { path = "..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notebooklm_mcp"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501", "B008"]
