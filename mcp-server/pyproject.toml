[project]
name = "notebooklm-mcp"
version = "0.1.0"
description = "Model Context Protocol server for Google NotebookLM"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    # Plain notebooklm-py, NOT the [mcp] extra. That extra installs standalone
    # fastmcp for the root package's own MCP server (`notebooklm-mcp`), pinned
    # to fastmcp 3.4.x, which requires mcp<2. This server is built on mcp
    # itself, so sharing a venv with that pin would hold it on mcp 1.x and the
    # 2025-11-25 protocol. It does not need fastmcp: its OAuth tokens come from
    # FileBackedOAuthProvider, whose lifetimes are set in config, not from
    # fastmcp's in-memory provider. Consequence: the root `notebooklm-mcp`
    # console script still gets installed here but cannot start. Run it from a
    # venv with notebooklm-py[mcp] instead.
    "notebooklm-py>=0.8.0",
    # 2.2: MCPServer with both protocol eras (2025-11-25 handshake and
    # 2026-07-28 stateless), cache hints and Mcp-Method/Mcp-Name checks.
    # Capped below the next major, which will break the API again.
    "mcp>=2.2.0,<3",
    "starlette>=0.37.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.4.0",
]
https = ["uvicorn[standard]>=0.30.0"]

[project.scripts]
# NOT `notebooklm-mcp`: the root notebooklm-py package already ships a console
# script by that name (notebooklm.mcp.__main__:main, its upstream-documented
# entry point). Both packages install into the same venv, so a shared name is
# won by whichever is installed last — which silently swapped this CLI for the
# root's and broke callers passing the positional `stdio` arg this one takes.
notebooklm-mcp-local = "notebooklm_mcp.server:main"
notebooklm-mcp-remote = "notebooklm_mcp.remote:main"
notebooklm-mcp-sse = "notebooklm_mcp.sse_server:main"

[tool.uv.sources]
notebooklm-py = { path = "..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notebooklm_mcp"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501", "B008"]
